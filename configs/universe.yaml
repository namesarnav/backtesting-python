# Universe: the S&P 500 constituents, as a cross-sectional research
# universe. Tickers are in Yahoo format (BRK.B -> BRK-B, BF.B -> BF-B).
#
# Every ticker is QUOTED, and must stay that way. YAML 1.1 resolves a
# bare ON to the boolean true, which silently turns ON Semiconductor
# into a request for a ticker named "true". OFF/YES/NO/Y/N are the same
# trap for any future constituent.
#
# SURVIVORSHIP / LOOK-AHEAD WARNING -- read before trusting any result
# computed on this universe. This is the index membership as of TODAY,
# not as of the backtest start date, and the two differ badly:
#
#   * 118 of these 503 names (23%) joined the index on or
#     after 2019-01-01, so holding them from 2019 is a bet nobody could
#     have placed -- you are buying the companies that were about to be
#     promoted into the index.
#   * every company deleted from the index between 2019 and 2023 --
#     acquired, bankrupt, or simply shrunk out -- is absent entirely.
#
# Both errors push results the same way: up. A point-in-time membership
# file is the only real fix; until then, treat the headline numbers on
# this universe as an upper bound, and compare strategies to each other
# rather than to an absolute bar.

